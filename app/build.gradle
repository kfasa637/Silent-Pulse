plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.silentpulse'
    compileSdk 33

    defaultConfig {
        applicationId "com.silentpulse"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    kotlinOptions { jvmTarget = '1.8' }
}
