name: Expand project archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.event.head_commit.message != 'Expand Silent Pulse project files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract project into repository root
        run: |
          ARCHIVE="Silent-Pulse-Android-Project.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Project archive not found; nothing to expand."
            exit 0
          fi
          mkdir -p /tmp/silent-pulse-extract
          unzip -q "$ARCHIVE" -d /tmp/silent-pulse-extract
          cp -a /tmp/silent-pulse-extract/Silent-Pulse/. .
          rm "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Silent Pulse project files"
          git push
